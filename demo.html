<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>VDB v4 · X-Ray / Mechanism Mode</title>
<style>body{background:#0a0a14;margin:0;padding:28px;font-family:ui-monospace,monospace;color:#cbd5e1}
h1{font-size:18px;color:#7dd3fc;font-weight:500}.hint{font-size:13px;color:#64748b;margin:10px 0 18px;line-height:1.6}</style></head>
<body>
  <h1>VDB v4 · X-Ray / Mechanism Mode — "x-ray this refactor"</h1>
  <div class="hint">Tabs switch views. On <b>Mechanism</b>, step ◀ ▶ through the 7 slices — the active layer highlights, the rest dim, and the callout explains the why. "Explain this step" fires sendPrompt with the live step number interpolated in.</div>
  <div id="board"></div>
  <script src="./vdb.js"></script>
  <script>
    VDB('#board', {
      theme:'blueprint', title:'Clean Architecture Refactor', tag:'x-ray',
      state:{ view:'overview', step:1 }, animate:true,
      score:{ label:'economy', grade:'B+', detail:[{label:'Signal',value:88},{label:'Directness',value:80},{label:'Thrift',value:58,note:'58 · re-verifies'},{label:'Compounding',value:91}] },
      components:[
        { type:'controls', items:[
          { type:'tabs', param:'view', options:[
            {value:'overview',label:'Overview'},{value:'before',label:'Before'},
            {value:'after',label:'After'},{value:'graph',label:'Graph'},{value:'mechanism',label:'Mechanism'} ] } ]},

        { when:'view==overview', type:'focal', value:'16 → 20', label:'flat files → 4 clean layers' },
        { when:'view==overview', type:'callout', text:'Same app, cleaner bones. Seven behavior-preserving slices. Open the Mechanism tab to step through how it was taken apart.' },

        { when:'view==before', type:'diagram', layers:[
          { tag:'js/', color:'var(--accent)', label:'16 flat files, concerns mixed',
            sub:'config · auth · data · render · health · skills · modal · pulse · profile · …' } ]},
        { when:'view==before', type:'callout', text:'One folder: data-fetching, DOM rendering, and pure logic all intermingle. Hard to test or reason about in isolation.' },

        { when:'view==after', type:'diagram', layers:[
          { tag:'APP',  label:'app · auth · controller', sub:'boot, wiring, orchestration' },
          { tag:'VIEW', label:'render · detail · modal · pulse · profile · *-view', sub:'DOM rendering only' },
          { tag:'IO',   label:'supabase · github · data', sub:'the only outward calls' },
          { tag:'CORE', label:'format · state · config · similarity · health · skills', sub:'pure — no DOM / no IO' } ]},
        { when:'view==after', type:'callout', text:'Dependencies point one way — downward. CORE depends on nothing, which makes it the easy part to test.' },
        { when:'view==after', type:'flow', title:'dependency flow (a dot traces it)', nodes:['APP','VIEW','IO','CORE'] },
        { when:'view==graph', type:'nodes', title:'module dependencies (hand-rolled)', nodes:[{id:'app',label:'APP',col:0},{id:'view',label:'VIEW',col:1},{id:'io',label:'IO',col:1},{id:'core',label:'CORE',col:2}], edges:[['app','view'],['app','io'],['view','core'],['io','core']] },
        { when:'view==graph', type:'mermaid', title:'render pipeline (mermaid · lazy-loaded)', code:'graph LR; Spec[tiny spec]-->Engine[vdb.js on CDN]-->Board[themed board]' },

        { when:'view==mechanism', type:'controls', items:[
          { type:'stepper', param:'step', steps:7, labels:[
            'S1 · format','S2 · state','S3 · io','S4 · domain⟂view','S5 · data','S6 · store','S7 · folderize'] } ]},
        { when:'view==mechanism', type:'stage', active:'step', parts:[
          { label:'core/format.js',        step:1, note:'<b>S1</b> · pure helpers → one testable home, zero deps' },
          { label:'core/state.js',         step:2, note:'<b>S2</b> · state leaves config; config = pure constants' },
          { label:'io/ · supabase·github', step:3, note:'<b>S3</b> · all outward calls behind one door' },
          { label:'core + view',           step:4, note:'<b>S4</b> · domain logic stops touching the DOM' },
          { label:'data → controller',     step:5, note:'<b>S5</b> · data returns data; view wiring moves up' },
          { label:'store subscribe/emit',  step:6, note:'<b>S6</b> · data changes notify views — decoupled' },
          { label:'core / io / view / app',step:7, note:'<b>S7</b> · four layers; direction enforced by structure' } ]},
        { when:'view==mechanism', type:'controls', items:[
          { type:'button', label:'Explain this step →', action:{ prompt:'Explain clean-architecture refactor slice S{step} in plain terms — what moved and why it mattered.' } } ]},
      ]
    });
  </script>
</body></html>
